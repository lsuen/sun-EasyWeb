<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>用户中心</title>
    <style>
        body {
            font-family: "Microsoft YaHei", Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .container {
            background: white;
            padding: 50px;
            border-radius: 15px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            text-align: center;
            min-width: 500px;
        }
        
        h1 {
            color: #667eea;
            margin-bottom: 20px;
        }
        
        .welcome {
            font-size: 18px;
            color: #333;
            margin-bottom: 30px;
        }
        
        .logout-btn {
            padding: 12px 40px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            transition: all 0.3s;
        }
        
        .logout-btn:hover {
            background: #764ba2;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎉 登录成功</h1>
        <p class="welcome">欢迎，{{ username }}！</p>
        <p style="color: #666; margin-bottom: 30px;">这是用户中心页面，用于演示登录后的状态。</p>
        <a href="/logout"><button class="logout-btn" id="logout-btn">退出登录</button></a>
    </div>
</body>
</html>
